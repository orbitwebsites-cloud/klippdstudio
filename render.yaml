services:
  - type: web
    name: klipped-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ORIGINS
        value: https://klippdstudio.com,https://www.klippdstudio.com
      - key: SEED_GROQ_KEY
        sync: false
      - key: SEED_CEREBRAS_KEY
        sync: false
