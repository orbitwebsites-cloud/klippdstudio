# Optional paid deployment example. Do not apply this Blueprint unless persistent
# uploads/renders are worth enabling and the paid Render service is approved.
services:
  - type: web
    name: klipped-backend-persistent
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ORIGINS
        value: https://klippdstudio.com,https://www.klippdstudio.com
      - key: SEED_GROQ_KEY
        sync: false
      - key: SEED_CEREBRAS_KEY
        sync: false
      - key: ASSET_MALWARE_SCANNER
        value: auto
    disk:
      name: klipped-data
      mountPath: /app/data
      sizeGB: 20
